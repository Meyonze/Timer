<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2878d4" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <link rel="stylesheet" href="styles.css?v=4" />
    <title>実感タイマー</title>
  </head>
  <body>
    <main class="app-shell">
      <header class="top-bar">
        <button id="settings-button" class="icon-button" type="button" aria-label="設定を開く">⚙</button>
        <div class="top-actions">
          <button id="cancel-button" class="cancel-button" type="button" aria-label="タイマーを終了" hidden>終了</button>
          <output id="remaining-time" aria-label="残り時間">0:00</output>
        </div>
      </header>

      <section id="timer-stage" aria-label="視覚タイマー">
        <div id="disk-view" class="timer-view" data-mode="disk">
          <svg id="dial-svg" viewBox="0 0 500 500" role="img" aria-label="時間を設定する円盤">
            <circle class="dial-base" cx="250" cy="250" r="201" />
            <path id="disk-fill" class="timer-fill" d="" />
            <g id="dial-ticks"></g>
            <g id="dial-labels"></g>
            <circle class="dial-center" cx="250" cy="250" r="126" />
            <text id="dial-main-text" class="dial-main-text" x="250" y="257" text-anchor="middle">10分</text>
            <text id="dial-help-text" class="dial-help-text" x="250" y="288" text-anchor="middle">円をなぞって時間を決める</text>
          </svg>
        </div>

      </section>
    </main>

    <dialog id="settings-dialog" aria-labelledby="settings-title">
      <form id="settings-form" method="dialog">
        <div class="dialog-heading"><h1 id="settings-title">設定</h1><button class="close-button" value="close" aria-label="閉じる">×</button></div>
        <label>タイマー色 <input id="color-input" type="color" value="#2878d4" /></label>
        <label>音量 <input id="volume-input" type="range" min="0" max="1" step="0.05" value="0.55" /></label>
        <label>終了音
          <select id="sound-input">
            <option value="gentle">ポーン♪</option>
            <option value="chime">やさしいチャイム</option>
            <option value="bell">ベル</option>
          </select>
        </label>
        <div class="dialog-actions"><button type="button" id="sound-test-button">音を試す</button><button type="submit" value="save" class="primary-button">保存</button></div>
      </form>
    </dialog>

    <script defer src="app.js?v=6"></script>
  </body>
</html>
